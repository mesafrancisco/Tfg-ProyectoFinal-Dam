<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styleLogin.css">
</head>
<body>

<div class="left-section"></div>

<div class="right-section">
  <div class="container">
    <div class="row justify-content-center">
      <!-- Logo centrado arriba -->
      <div style="margin-bottom: 20px; text-align: center;">
        <img th:src="@{/images/logo.png}" alt="Logo"
             style="max-width: 130px; border-radius: 50%; object-fit: cover;">
      </div>

      <!-- Contenedor principal -->
      <div class="col-xl-12 d-flex" style="align-items: center; justify-content: center;">
        <div class="login-container">
          <h3 class="text-center mb-4">Ohhh! Sentimos mucho que te hayas olvidado</h3>
          <p class="text-center">Te ayudaremos :)</p>

          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
          <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

          <form th:action="@{/recuperar}" method="post">
            <!-- Email -->
            <div class="form-group">
              <label for="email">Introduce tu email:</label>
              <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <!-- Botón de recuperación -->
            <div class="form-group text-center">
              <button type="submit" class="btn btn-primary btn-block">
                Enviar enlace para restablecer <i class="fas fa-envelope"></i>
              </button>
            </div>
          </form>

          <!-- Enlace de volver -->
          <div class="form-group text-center">
            <span>¿Recordaste tu contraseña? <a th:href="@{/login}">Inicia sesión aquí</a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</body>
</html>
