<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/styleLogin.css" />
  <style>
    .form-container {
      margin-top: 50px;
      float: right;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="form-container">
    <h2 class="text-right">Ohhh! Sentimos mucho que te hayas olvidado.</h2>
    <br>
    <h1>Te ayudaremos :)</h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <form th:action="@{/recuperar}" method="post">
      <div class="form-group">
        <label for="email" class="control-label pull-right">Introduce tu email:</label>
        <input type="email" class="form-control" id="email" name="email" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar enlace para restablecer</button>
    </form>

    <div class="text-right" style="margin-top: 10px;">
      <a href="/login">Volver al login</a>
    </div>
  </div>
</div>
</body>
</html>
