<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <title>Lista de incidencias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link rel="stylesheet" type="text/css" href="/css/stylemenu.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menubueno :: menu}"></div>
<!-- Contenedor principal con fondo blanco -->
<div class="container-fluid mt-5">
    <div class="row justify-content-end mt-4">
        <!-- Contenedor para filtro -->
        <div class="col-10">
            <div class="p-4" style="background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
                <h3 class="mb-4">Filtro de Incidencias</h3>
                <form th:action="@{/incidencias}" class="form">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="titulo">Título:</label>
                            <input type="text" name="titulo" id="titulo" class="form-control bg-transparent" placeholder="Título" th:value="${titulo}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="descripcion">Descripción:</label>
                            <input type="text" name="descripcion" id="descripcion" class="form-control bg-transparent" placeholder="Descripción" th:value="${descripcion}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="estado">Estado:</label>
                            <select name="estado" id="estado" class="form-control bg-transparent">
                                <option value="" th:selected="${estado == null or estado == ''}">-- Todos --</option>
                                <option value="Registrada" th:selected="${estado == 'Registrada'}">Registrada</option>
                                <option value="En_Curso" th:selected="${estado == 'En_Curso'}">En Curso</option>
                                <option value="Cerrada" th:selected="${estado == 'Cerrada'}">Cerrada</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fechaInicio">Fecha Inicio:</label>
                            <input type="date" name="fechaInicio" id="fechaInicio" class="form-control bg-transparent" th:value="${fechaInicio}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fechaFin">Fecha Resolución:</label>
                            <input type="date" name="fechaFin" id="fechaFin" class="form-control bg-transparent" th:value="${fechaFin}">
                        </div>

                        <div class="col-12 d-flex justify-content-start">
                            <input type="submit" class="btn btn-primary mb-2" value="Buscar">
                            <input type="button" class="btn btn-secondary mb-2 ml-2" value="Limpiar" onclick="limpiarCampos()">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row justify-content-end mt-4">
        <!-- Contenedor para listado de incidencias -->
        <div class="col-10">
            <div class="p-4" style="background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Incidencias Activas</h3>
                    <a href="/incidencias/nuevo" class="btn btn-success">Nueva Incidencia</a>
                </div>
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Estado</th>

                        <th>Fecha Inicio</th>
                        <th>Fecha Resolución</th>
                        <th>Asignado a:</th>
                        <th th:if="${esAdmin}">Asignacion</th>
                        <th th:if="${esAdmin}" style="width: 200px;">Acciones</th>
                        <th th:if="${!esAdmin}">Editar Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="incidencia : ${incidencias}">
                        <td th:text="${incidencia.titulo}">Título</td>
                        <td th:text="${incidencia.descripcion}">Descripción</td>
                        <td th:text="${incidencia.estado}">Estado</td>

                        <td th:text="${incidencia.fechaCreacion != null} ? ${#temporals.format(incidencia.fechaCreacion, 'dd/MM/yyyy HH:mm')} : 'Sin fecha'">Creación</td>
                        <td th:text="${incidencia.fechaResolucion != null} ? ${#temporals.format(incidencia.fechaResolucion, 'dd/MM/yyyy HH:mm')} : 'Sin fecha'">Resolución</td>
                        <td th:text="${incidencia.asignadoA}">Asignado</td>

                        <td th:if="${esAdmin}" class="text-center">
                            <form th:action="@{/incidencias/asignar/{id}(id=${incidencia.id})}" method="post">
                                <input type="hidden" name="incidenciaId" th:value="${incidencia.id}" />
                                <select name="correoUsuario" required>
                                    <option value="" disabled selected>Correo electronico</option>
                                    <option th:each="usuario : ${usuarios}" th:value="${usuario.email}" th:text="${usuario.email}"></option>
                                </select>
                                <button type="submit" class="btn btn-primary">Asignar</button>
                            </form>
                        </td>

                        <td th:if="${esAdmin}" class="text-center">
                            <a th:href="@{/incidencias/editar/{id}(id=${incidencia.id})}" class="btn btn-info">Editar</a>
                            <a th:href="@{/incidencias/{id}(id=${incidencia.id})}" class="btn btn-danger">Eliminar</a>
                        </td>
                        <td th:if="${!esAdmin}">
                            <form th:action="@{/incidencias/estado/{id}(id=${incidencia.id})}" method="post">
                                <select name="nuevoEstado" class="form-control mb-2" required>
                                    <option value="Registrada" th:selected="${incidencia.estado == 'Registrada'}">Registrada</option>
                                    <option value="En_Curso" th:selected="${incidencia.estado == 'En_Curso'}">En Curso</option>
                                    <option value="Cerrada" th:selected="${incidencia.estado == 'Cerrada'}">Cerrada</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <!-- Paginación -->
                <div class="row">
                    <div class="col-12">
                        <ul class="pagination justify-content-center">
                            <!-- Botón de Primera página -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" href="#"
                                   th:href="@{/incidencias(page=0, size=${size}, palabraClave=${palabraClave}, titulo=${titulo}, estado=${estado}, descripcion=${descripcion})}">
                                    <i class="fas fa-angle-double-left"></i> <!-- Flecha doble para ir al inicio -->
                                </a>
                            </li>

                            <!-- Botón de página anterior -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" href="#"
                                   th:href="@{/incidencias(page=${currentPage - 1}, size=${size}, palabraClave=${palabraClave}, titulo=${titulo}, estado=${estado}, descripcion=${descripcion})}">
                                    <i class="fas fa-angle-left"></i> <!-- Flecha para atrás -->
                                </a>
                            </li>

                            <!-- Botones de páginas -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" href="#"
                                   th:href="@{/incidencias(page=${i}, size=${size}, palabraClave=${palabraClave}, titulo=${titulo}, estado=${estado}, descripcion=${descripcion})}"
                                   th:text="${i + 1}"></a>
                            </li>

                            <!-- Botón de página siguiente -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" href="#"
                                   th:href="@{/incidencias(page=${currentPage + 1}, size=${size}, palabraClave=${palabraClave}, titulo=${titulo}, estado=${estado}, descripcion=${descripcion})}">
                                    <i class="fas fa-angle-right"></i> <!-- Flecha para adelante -->
                                </a>
                            </li>

                            <!-- Botón de última página -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" href="#"
                                   th:href="@{/incidencias(page=${totalPages - 1}, size=${size}, palabraClave=${palabraClave}, titulo=${titulo}, estado=${estado}, descripcion=${descripcion})}">
                                    <i class="fas fa-angle-double-right"></i> <!-- Flecha doble para ir al final -->
                                </a>
                            </li>
                        </ul>
                    </div>
            </div>
        </div>
    </div>
</div>
</div>
</div>
</div>
<script src="/js/js.js"></script>
</body>
</html>
