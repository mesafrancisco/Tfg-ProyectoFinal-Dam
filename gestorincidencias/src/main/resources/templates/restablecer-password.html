<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styleLogin.css">
</head>
<body>
<div class="container">
    <h2>Restablecer tu contraseña</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <form th:action="@{/guardar-nueva-contrasena}" method="post">
        <input type="hidden" name="token" th:value="${token}" />

        <div class="form-group">
            <label for="contrasena">Nueva contraseña:</label>
            <input type="password" id="contrasena" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="confirmarContrasena">Confirmar contraseña:</label>
            <input type="password" id="confirmarContrasena" name="confirmPassword" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
    </form>
</div>
</body>
</html>
