<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styleLogin.css">
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styleLogin.css">
    <style>
 body {
    background-color: #86b6e6;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.wrapper {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    padding-right: 5%;
}

.container {
    max-width: 400px;
    width: 100%;
    padding: 30px;
    background-color: rgb(171, 209, 237);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

.btn-primary {
    width: 100%;
}

    </style>
</head>
<body>
<div class="left-section"></div>
<div class="right-section">
    <div class="wrapper">
        <div class="container">
            <h2>Restablecer tu contraseña</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

            <form th:action="@{/guardar-nueva-contrasena}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="contrasena">Nueva contraseña:</label>
                    <input type="password" id="contrasena" name="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmarContrasena">Confirmar contraseña:</label>
                    <input type="password" id="confirmarContrasena" name="confirmPassword" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
            </form>
        </div>
    </div>
</div>

</body>

</html>
