<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <title>Calendario de Incidencias</title>

    <!-- Estilos base -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css?v=1.0.1">
    <link rel="stylesheet" href="/css/stylemenu.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

</head>
<body>

<style>
    .fc-event.registrada {
        background-color: green !important;
        color: white !important;
    }

    .fc-event.en_curso {
        background-color: yellow !important;
        color: black !important;
    }

    .fc-event.cerrada {
        background-color: red !important;
        color: white !important;
    }
</style>

<!-- Menú -->
<div th:replace="~{fragments/menubueno :: menu}"></div>

<!-- Contenedor principal -->
<div class="container-fluid mt-5">
    <div class="row justify-content-end mt-4">
        <div class="col-10">
            <div class="p-4" style="background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
                <h2 class="mb-4">Calendario de Incidencias</h2>
                <div id='calendar'></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendarEl = document.getElementById('calendar');

      var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'es',
           buttonText: {
            today:    'Hoy',
            month:    'Mes',
            week:     'Semana',
            day:      'Día',
            list:     'Lista'
          },
          height: 700,
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          events: '/api/incidencias/calendario',
          eventDidMount: function(info) {
            const estado = info.event.extendedProps.estado;

            if (estado) {
                const estadoClass = estado.toLowerCase(); // "registrada", "en_curso", "cerrada"
                info.el.classList.add(estadoClass);
            }
          }

       });

      calendar.render();
    });

    document.addEventListener("DOMContentLoaded", function () {
    const toggleButton = document.getElementById("dark-mode-toggle");
    if (!toggleButton) {
      console.warn('No se encontró el botón dark-mode-toggle');
      return;
    }
    const body = document.body;

    // Resto del código...
    if (localStorage.getItem("dark-mode") === "enabled") {
        body.classList.add("dark-mode");
        toggleButton.textContent = "Modo Claro";
    }

    toggleButton.addEventListener("click", function () {
        body.classList.toggle("dark-mode");
        if (body.classList.contains("dark-mode")) {
            localStorage.setItem("dark-mode", "enabled");
            toggleButton.textContent = "Modo Claro";
        } else {
            localStorage.setItem("dark-mode", "disabled");
            toggleButton.textContent = "Modo Oscuro";
        }
    });
});

</script>

<script src="js/js.js"></script>
</body>
</html>
