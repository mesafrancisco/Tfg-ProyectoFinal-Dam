<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head xmlns:th="http://www.thymeleaf.org">
  <meta charset="UTF-8">
  <title>Cuadro De Mandos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stylemenu.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div th:replace="~{fragments/menubueno :: menu}"></div>

<div class="container-fluid mt-5">
  <div class="row justify-content-end mt-4">
    <div class="col-10">
      <div class="p-4" style="background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

        <!-- Botones filtro y gráfico -->
        <div class="d-flex mb-3">
          <button class="btn btn-primary mr-2" onclick="toggleFiltro()">Filtro</button>
          <button class="btn btn-secondary" onclick="toggleGrafico()">Gráfico</button>
        </div>

        <!-- Contenedor gráfico oculto inicialmente -->
        <div id="graficoContainer" style="display:none; max-width: 100%; margin-bottom: 20px;">
          <h3>Incidencias por Estado</h3>
          <div style="display: flex; justify-content: space-around; align-items: center;">
            <!-- Gráfico de barras original -->
            <canvas id="estadoChart" width="600" height="300" style="flex-shrink: 0;"></canvas>

            <!-- Gráfico circular -->
            <canvas id="estadoPieChart" width="600" height="300" style="flex-shrink: 0;"></canvas>
          </div>
        </div>
        <!-- Filtro: mejorado estilo y estructura -->
        <div id="filtroContainer" style="display:none;">
          <h3 class="mb-4">Filtro de Incidencias</h3>
          <form id="filtroForm" th:action="@{/cuadrodemando}" method="get" class="form">
            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" class="form-control bg-transparent" placeholder="Título" th:value="${titulo}">
              </div>
              <div class="form-group col-md-6">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion" class="form-control bg-transparent" placeholder="Descripción" th:value="${descripcion}">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-4">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" class="form-control bg-transparent">
                  <option value="">--Todos--</option>
                  <option value="Registrada" th:selected="${estado == 'Registrada'}">Registrada</option>
                  <option value="En_Curso" th:selected="${estado == 'En_Curso'}">En Curso</option>
                  <option value="Cerrada" th:selected="${estado == 'Cerrada'}">Cerrada</option>
                </select>
              </div>
              <div class="form-group col-md-4">
                <label for="fechaInicio">Fecha Inicio</label>
                <input type="date" id="fechaInicio" name="fechaInicio" class="form-control bg-transparent" th:value="${fechaInicio}">
              </div>
              <div class="form-group col-md-4">
                <label for="fechaFin">Fecha Fin</label>
                <input type="date" id="fechaFin" name="fechaFin" class="form-control bg-transparent" th:value="${fechaFin}">
              </div>
            </div>

            <div class="form-group d-flex">
              <button type="submit" class="btn btn-primary mr-2">Buscar</button>
              <button type="button" class="btn btn-secondary" onclick="limpiarFiltro()">Limpiar</button>
            </div>
          </form>
        </div>

        <!-- Tabla listado incidencias -->
        <table class="table table-striped table-bordered mt-4">
          <thead class="table-dark">
          <tr>
            <th>Título</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Fecha Resolución</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="incidencia : ${incidencias}">
            <td th:text="${incidencia.titulo}">Título</td>
            <td th:text="${incidencia.descripcion}">Descripción</td>
            <td th:text="${incidencia.estado}">Estado</td>
            <td th:text="${incidencia.fechaCreacion}">Creación</td>
            <td th:text="${incidencia.fechaResolucion}">Resolución</td>
          </tr>
          </tbody>
        </table>

        <!-- Paginación -->
        <div class="row">
          <div class="col-12">
            <ul class="pagination justify-content-center">
              <!-- Paginación aquí -->
            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  function toggleFiltro() {
    const filtro = document.getElementById('filtroContainer');
    filtro.style.display = (filtro.style.display === 'none' || filtro.style.display === '') ? 'block' : 'none';
  }

  function toggleGrafico() {
    const grafico = document.getElementById('graficoContainer');
    grafico.style.display = (grafico.style.display === 'none' || grafico.style.display === '') ? 'block' : 'none';
  }

  function limpiarFiltro() {
  document.getElementById('filtroForm').reset();
  window.location.href = window.location.pathname;
}

</script>

<script th:inline="javascript">
  const conteoPorEstado = /*[[${conteoPorEstado}]]*/ {};
  const estados = Object.keys(conteoPorEstado);
  const cantidades = Object.values(conteoPorEstado);

  // Gráfico de barras
  const ctxBar = document.getElementById('estadoChart').getContext('2d');
  const estadoChart = new Chart(ctxBar, {
    type: 'bar',
    data: {
      labels: estados,
      datasets: [{
        label: 'Número de Incidencias',
        data: cantidades,
        backgroundColor: [
          'rgba(54, 162, 235, 0.7)',
          'rgba(255, 206, 86, 0.7)',
          'rgba(75, 192, 192, 0.7)'
        ],
        borderColor: [
          'rgba(54, 162, 235, 1)',
          'rgba(255, 206, 86, 1)',
          'rgba(75, 192, 192, 1)'
        ],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          precision: 0
        }
      }
    }
  });

  // Gráfico circular (doughnut)
  const ctxPie = document.getElementById('estadoPieChart').getContext('2d');
  const estadoPieChart = new Chart(ctxPie, {
    type: 'doughnut',
    data: {
      labels: estados,
      datasets: [{
        data: cantidades,
        backgroundColor: [
          'rgba(54, 162, 235, 0.7)',
          'rgba(255, 206, 86, 0.7)',
          'rgba(75, 192, 192, 0.7)'
        ],
        borderColor: [
          'rgba(54, 162, 235, 1)',
          'rgba(255, 206, 86, 1)',
          'rgba(75, 192, 192, 1)'
        ],
        borderWidth: 1
      }]
    },
    options: {
      responsive: false,
      plugins: {
        legend: {
          position: 'right'
        }
      }
    }
  });
</script>

<script src="js/js.js"></script>

</body>
</html>
